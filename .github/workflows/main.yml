- name: Build Docker model image
        working-directory: MLProject
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          RUN_ID="${{ secrets.runid.outputs.run_id || steps.runid.outputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: run_id is empty"
            exit 1
          fi

          DOCKERHUB_USERNAME="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: Docker Hub username is empty"
            exit 1
          fi
          
          IMAGE="$DOCKERHUB_USERNAME/wine-quality-model:latest"
          
          # Membuat Dockerfile secara otomatis di dalam folder MLProject
          cat > Dockerfile <<'EOF'
          FROM python:3.12-slim

          ARG RUN_ID

          ENV RUN_ID="${RUN_ID}" \
              MLFLOW_TRACKING_URI="file:///app/mlruns" \
              PYTHONUNBUFFERED=1

          WORKDIR /app

          RUN apt-get update \
              && apt-get install -y --no-install-recommends build-essential \
              && rm -rf /var/lib/apt/lists/*

          # Menyalin requirements.txt yang ada di folder kerja saat ini
          COPY requirements.txt /app/requirements.txt
          RUN python -m pip install --upgrade pip \
              && pip install --no-cache-dir -r /app/requirements.txt \
              && pip install --no-cache-dir "fastapi==0.109.2" "starlette==0.36.3"

          COPY mlruns /app/mlruns

          EXPOSE 8000

          CMD ["mlflow", "models", "serve", "-m", "/app/mlruns/0/${RUN_ID}/artifacts/model", "--host", "0.0.0.0", "--port", "8000", "--env-manager", "local"]
          EOF

          # Menjalankan docker build dengan context tanda titik (.) yang mengarah ke folder MLProject
          docker build \
            --build-arg RUN_ID="$RUN_ID" \
            -t "$IMAGE" \
            .
